<button
  class="relative grid size-11 place-items-center border-0 bg-transparent cursor-pointer focus-visible:outline-3 focus-visible:outline-primary focus-visible:outline-offset-3"
  [class]="mobileOnly() ? 'min-[600px]:hidden' : ''"
  type="button"
  [attr.aria-label]="label()"
>
  <svg
    class="inline-block size-5 flex-none"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.7"
    aria-hidden="true"
  >
    @switch (name()) {
      @case ('search') {
        <circle cx="10.8" cy="10.8" r="6.5" />
        <path d="m16 16 4.2 4.2" />
      }
      @case ('shopping-bag') {
        <path d="M5 8h14l1 12H4L5 8Z" />
        <path d="M9 9V6a3 3 0 0 1 6 0v3" />
      }
      @case ('menu') {
        <path d="M4 7h16M4 12h16M4 17h16" />
      }
    }
  </svg>
  <ng-content />
</button>
